<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: relay-dashboard-c.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#f8f8f8}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:853px">
  <div class="r-top-chrome region chrome" data-region="top-chrome"><!-- white safe-area app bar with Relay and inbox --></div>
  <div class="r-brand-title region text" data-region="brand-title"><!-- large Relay title, heavy system sans --><p style="font-size:var(--r-brand-title-font);font-family:var(--r-brand-title-family),sans-serif;font-weight:var(--r-brand-title-weight);line-height:1.05;margin:0">brand-title</p></div>
  <div class="r-next-action-surface region chrome" data-region="next-action-surface"><!-- solid cobalt urgent action band --></div>
  <div class="r-next-action-copy region text" data-region="next-action-copy"><!-- white action label, task title, metadata --><p style="line-height:1.05;margin:0">next-action-copy</p></div>
  <div class="r-accept-countdown region text" data-region="accept-countdown"><!-- white acceptance deadline with tabular countdown --><p style="line-height:1.05;margin:0">accept-countdown</p></div>
  <div class="r-response-controls region control" data-region="response-controls"><!-- paired accept and decline Material controls: rebuild the control's chrome from the crop (comp-spec.mjs --crop response-controls); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-risk-heading region text" data-region="risk-heading"><!-- At risk section heading and see all action --><p style="line-height:1.05;margin:0">risk-heading</p></div>
  <div class="r-risk-row region control" data-region="risk-row"><!-- expanded urgent task row with semantic severity, deadline and owner: rebuild the control's chrome from the crop (comp-spec.mjs --crop risk-row); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-escalation-ladder region control" data-region="escalation-ladder"><!-- three step numbered escalation ladder with labels and times: rebuild the control's chrome from the crop (comp-spec.mjs --crop escalation-ladder); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-risk-rows region control" data-region="risk-rows"><!-- compact at-risk task rows: rebuild the control's chrome from the crop (comp-spec.mjs --crop risk-rows); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-track-heading region text" data-region="track-heading"><!-- On track section heading and see all action --><p style="font-size:var(--r-track-heading-font);line-height:1.05;margin:0">track-heading</p></div>
  <div class="r-track-rows region control" data-region="track-rows"><!-- compact on-track task rows: rebuild the control's chrome from the crop (comp-spec.mjs --crop track-rows); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-bottom-navigation region chrome" data-region="bottom-navigation"><!-- Material navigation bar with create FAB --></div>
</main>
</body>
</html>
